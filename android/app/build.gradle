plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.nithu.geosnap"
    compileSdk 36
    ndkVersion "28.2.13676358"

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.nithu.geosnap"
        minSdk 29
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig (keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    def cameraXVersion = "1.4.2"
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    implementation "androidx.camera:camera-view:$cameraXVersion"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "com.google.android.gms:play-services-location:21.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}

flutter {
    source "../.."
}
