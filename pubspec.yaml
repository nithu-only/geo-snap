name: geo_snap
description: Don't Just Snap. GeoSnap - A private offline-first GPS camera for Android.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.1.1
  geocoding: ^3.0.0
  geolocator: ^14.0.2
  http: ^1.4.0
  intl: ^0.20.2
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  share_plus: ^13.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
